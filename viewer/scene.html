<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/*TITLE*/ · DriftSpec</title>
<style>
:root{
  --bg:#f6f4ef;--panel:#fffdf8;--fg:#1d1c1a;--muted:#6b675f;--line:#d6d0c3;--soft:#ece8de;
  --accent:#2f5d8a;--accent-soft:#d6e4f2;--req:#8a4b2f;--req-soft:#f3e3d8;
  --priv:#8c8579;--pkg:#efe9dc;--mod:#f8f5ee;--ifc:#e3edf7;
  --k-class:#3567a0;--k-function:#2a8a6e;--k-dataclass:#8a5cb3;--k-enum:#b07a22;--ok:#2f8a4a;--warn:#d9822b;
  --r-owns:#c2185b;--r-agg:#00838f;--r-uses:#5c6bc0;--r-calls:#c62828;
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151618;--panel:#1d1f22;--fg:#e8e6e1;--muted:#9a968d;--line:#3a3d42;--soft:#26292d;
  --accent:#7fb0e0;--accent-soft:#203a55;--req:#e3a27f;--req-soft:#3a271d;
  --priv:#857f75;--pkg:#1a1c1f;--mod:#212427;--ifc:#1c2a37;
  --k-class:#78a6dc;--k-function:#5cc4a2;--k-dataclass:#b994dc;--k-enum:#ddb25e;--ok:#6cc68a;--warn:#f0a35a;
  --r-owns:#f06292;--r-agg:#4dd0e1;--r-uses:#9fa8da;--r-calls:#ef7f7f;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
.stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
canvas.main{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.tools{position:absolute;right:10px;top:10px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;z-index:3;max-width:calc(100% - 20px)}
.tools button{height:34px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.crumbs{position:absolute;left:10px;top:10px;right:260px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-family:var(--mono);font-size:12px;pointer-events:none;z-index:2}
.crumbs button{pointer-events:auto;font:inherit;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.crumbs span{color:var(--muted);padding:0 2px}
.rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:2}
.rail button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:16px;cursor:pointer}
.rail .lvl{font-size:10.5px;color:var(--muted);text-align:center;width:62px;background:var(--panel);border-radius:6px;padding:3px 0;border:1px solid var(--line)}
.mini{position:absolute;left:10px;bottom:10px;width:170px;height:120px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;z-index:2}
.legend{position:absolute;left:190px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;z-index:2;max-width:calc(100% - 260px)}
.legend i{display:inline-block;width:5px;height:12px;vertical-align:-2px;margin-right:3px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.card{position:absolute;right:62px;top:54px;width:min(330px,calc(100% - 80px));max-height:calc(100% - 120px);overflow:auto;background:var(--panel);border:1px solid var(--accent);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px 12px;font-size:13px;z-index:4}
.card[hidden],.pop[hidden]{display:none}
.pop{position:absolute;width:min(340px,calc(100% - 20px));max-height:60%;overflow:auto;background:var(--panel);border:1px solid var(--accent);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:10px 12px;font-size:13px;z-index:5}
.pop .ttl{font-family:var(--mono);font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.pop h4{margin:8px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pop .row,.card .row{font-family:var(--mono);font-size:12px;display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.pop .n,.card .n{color:var(--muted);white-space:nowrap}
.pop .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin:2px 4px 0 0}
.card .title{font-family:var(--sans);font-size:12px;color:var(--fg);margin:0 0 4px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card .hd b{font-family:var(--mono);font-size:15px}
.card .st{color:var(--muted);font-family:var(--mono);font-size:11px}
.card h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--fg);display:flex;justify-content:space-between}
.card section{border-left:3px solid var(--c,var(--line));padding:2px 0 2px 9px;margin:12px 0 0}
.card .sum{font-size:12px;color:var(--muted);margin-top:2px}.card .sum .ok{color:var(--ok)}.card .sum .warn{color:var(--warn)}
.card .verb{font-size:11px;color:var(--muted);margin:5px 0 1px}
.card .rel{font-family:var(--mono);font-size:12px;padding:3px 5px;border-radius:5px;cursor:pointer;display:flex;flex-wrap:wrap;gap:0 4px;align-items:baseline}
.card .rel:hover{background:var(--soft)}
.card .rel .me{color:var(--c,var(--fg));font-weight:600}.card .rel .far{font-weight:600}
.card .rel .mod{margin-left:auto;color:var(--muted);font-size:11px}
.card .uct{border-collapse:collapse;font-size:12px;width:100%;table-layout:fixed}.card .uct th:first-child{width:55%}.card .uct td{overflow-wrap:anywhere}.card .uct .n{white-space:normal}.card .uct th{font-family:var(--mono);font-weight:600;font-size:11px;color:var(--muted);text-align:center;padding:2px 4px}
.card .uct td{padding:5px 4px;border-top:1px solid var(--soft);vertical-align:top}.card .uct td+td{text-align:center}
.card .uct button.play{border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:999px;padding:1px 10px;cursor:pointer}
.card .uct .ok{color:var(--ok)}.card .uct .warn{color:var(--warn)}
.card .rid{font-family:var(--mono);color:var(--req);font-weight:600}
.card .rqs .rq{font-family:var(--sans);font-size:12px;color:var(--fg);margin:3px 0}.card .rqs .rq b{font-family:var(--mono);color:var(--req);font-weight:600}
.card .acts{display:flex;gap:4px;align-items:center}
.card .it{font-family:var(--mono);font-size:12px;padding:3px 4px;border-radius:5px;cursor:pointer}
.card .it:hover{background:var(--soft)}
.card .rq{font-family:var(--mono);font-size:12px;color:var(--req)}
.card button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.card .x{border:0;font-size:18px;color:var(--muted);padding:0 4px}
/* the tour panel: beside the canvas on a wide screen, under it on a narrow one */
/* the tour plays along the bottom, its controls in one row; the details of a box stay docked on the right */
.tour{position:fixed;left:0;right:0;bottom:0;height:36%;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(220px,340px) 1fr minmax(160px,220px);grid-template-rows:auto 1fr;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tour .tb{grid-column:1/-1;border-top:1px solid var(--line)}
/* the bottom panel has two tabs: the tours, and the list of requirements */
.tour .tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.tour .tabs button{border:0!important;border-radius:0!important;height:32px!important;min-width:0!important;padding:0 10px;font-size:12.5px!important;background:var(--panel);color:var(--muted)}
.tour .tabs button[aria-selected=true]{background:var(--accent);color:var(--bg)}
.tour .rf,.tour #rbody{display:none}
.tour.listing .rf{display:flex;grid-column:2/-1;gap:8px;align-items:center;padding:8px 12px;min-width:0}
.tour.listing #rbody{display:block}
.tour.listing .tc,.tour.listing .td,.tour.listing #tsel,.tour.listing #tbody{display:none}
.tour .rf input{flex:1;min-width:80px;font:inherit;font-size:13px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.tour .rf .chips{display:flex;gap:4px;flex-wrap:wrap}
.tour .rf .chips button{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--panel);color:var(--fg);cursor:pointer}
.tour .rf .chips button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tour .rn{font-size:12px;color:var(--muted);white-space:nowrap}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px}
.rtab th{position:sticky;top:0;z-index:1;background:var(--panel);text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtab td{padding:5px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
.rtab tr.r{cursor:pointer}.rtab tr.r:hover{background:var(--soft)}.rtab tr.on{background:var(--accent-soft)}
.rtab .id{font-family:var(--mono);white-space:nowrap;color:var(--req)}
.rtab .t{min-width:200px}.rtab .n{font-family:var(--mono);text-align:right;white-space:nowrap}
.rtab .grp td{background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:600;padding:4px 8px}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.approved{border-color:var(--ok);color:var(--ok)}.badge.obsolete{text-decoration:line-through}
.vchip{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin:0 4px 2px 0;cursor:pointer;white-space:nowrap}
.vchip.test{border-color:var(--ok);color:var(--ok)}.vchip:hover{background:var(--soft)}
.miss{color:var(--warn);font-size:12px;white-space:nowrap}
.card .says{font-family:var(--sans);font-size:12.5px;line-height:1.45;margin:0 0 6px}
.card .tests{font-family:var(--mono);font-size:11px;color:var(--muted);margin:2px 0 6px 12px;word-break:break-all}
.tour .td{border-bottom:0!important;padding:8px 12px!important}
.tour[hidden]{display:none}
body.touring .stage{bottom:36%}
body.touring .legend,body.touring .mini{opacity:0;pointer-events:none}  /* the step's caption needs the bottom of the canvas */
body.carded.touring .tour{right:380px}
/* the card of a box docks where the tour panel does: the canvas makes room instead of hiding under it */
body.carded .stage{right:380px}
body.carded .card{position:fixed;right:0;top:0;bottom:0;width:380px;max-height:none;border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;padding:14px 16px 20px;z-index:6}
.tour .th{display:flex;gap:6px;align-items:center;padding:8px 10px 4px}
.tour select{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.tour .tc{display:flex;gap:5px;align-items:center;padding:4px 10px}
.tour .tc button,.tour .th button{min-width:38px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:15px;cursor:pointer}
.tour .tc button.play{background:var(--accent);color:var(--bg);border-color:var(--accent);min-width:48px}
.tour .tc input{flex:1;min-width:60px;accent-color:var(--accent)}
.tour .td{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.tour .td input{flex:1;accent-color:var(--accent)}
.tour .follow{display:none;font-size:12px;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer}
.tour .follow.on{display:inline-block}
.tour .tb{flex:1;overflow:auto}
.tour svg text{font-family:var(--mono);font-size:11px;fill:var(--fg)}
.caption{position:absolute;left:50%;transform:translateX(-50%);bottom:60px;max-width:calc(100% - 100px);background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:5px 12px;font-family:var(--mono);font-size:12.5px;box-shadow:0 4px 18px rgba(0,0,0,.12);pointer-events:none;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
.caption .z{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.caption[hidden]{display:none}
.rail,.mini,.legend{transition:opacity .25s}
.stage.quiet .rail,.stage.quiet .mini,.stage.quiet .legend{opacity:0;pointer-events:none}
@media (max-width:700px){
  .tour{height:46%;grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr}
  .tour.listing{grid-template-rows:auto auto 1fr}.tour.listing .rf{grid-column:1;flex-wrap:wrap}
  .tour .rf input{flex-basis:100%}
  .rtab .st,.rtab .n{display:none}.rtab .t{min-width:0}.rtab td,.rtab th{padding:5px 6px}
  body.carded.touring.listed .stage{z-index:7}  /* the stage is its own layer: lift it so its card covers the list */
  body.carded.touring.listed .card{display:block;position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:46%;z-index:8;border-top:1px solid var(--line)}  /* on a phone the card of a requirement opens over the list; closing it goes back to the list */
  body.carded.touring .tour{right:0}
  body.touring .stage{right:0;bottom:46%}
  body.carded .stage{right:0;bottom:46%}
  body.carded .card{left:0;top:auto;width:auto;height:46%;border-left:0;border-top:1px solid var(--line)}
  body.carded.touring .card{display:none}  /* a phone has room for one panel: the tour, and the card comes back when it closes */
  body.carded.touring .stage{bottom:46%}
  .tour .tc button,.tour .th button{min-width:34px;height:32px;font-size:13px}
  .caption{bottom:12px;font-size:11px;max-width:calc(100% - 24px)}
}
@media (max-width:600px){
  .tools button{height:30px;font-size:11.5px;padding:0 8px}
  .crumbs{top:92px;right:10px;font-size:10.5px}
  .rail{top:auto;bottom:70px;transform:none}.rail button{width:34px;height:34px;font-size:13px}.rail .lvl{display:none}
  .mini{width:96px;height:68px}
  .legend{display:none}
  .card{left:8px;right:8px;width:auto;top:auto;bottom:10px;max-height:46%}
}
</style>
<style id="theme">
/* ds view --css: the reader's stylesheet goes here, after the viewer's, so it wins.
   The viewer draws with these variables: --bg --panel --fg --muted --line --soft --accent --accent-soft
   --req --req-soft --priv --pkg --mod --ifc --k-class --k-function --k-dataclass --k-enum --ok --warn --mono --sans */
/*CSS*/
</style>

<body>
<div class="stage" id="stage">
  <canvas class="main" id="cv" aria-label="/*TITLE*/: the whole model, zoomable"></canvas>
  <div class="crumbs" id="crumbs"></div>
  <div class="caption" id="caption" hidden></div>
  <div class="tools"><button id="tours" aria-pressed="false" title="replay the behaviour over the structure">tours</button><button id="reqs" aria-pressed="false" title="every requirement and constraint, what answers to it and what proves it">requirements</button><button data-fam="inheritance" aria-pressed="true" title="inheritance and realisation, always drawn as lines">inheritance</button><button id="priv" aria-pressed="false">hide private</button><button id="fs">⛶</button></div>
  <div class="pop" id="pop" hidden></div>
  <div class="rail"><button id="up" aria-label="Up one level">▲</button><div class="lvl" id="lvl"></div><button id="down" aria-label="Go in">▼</button><button id="home" aria-label="See everything">⤢</button></div>
  <canvas class="mini" id="mini" aria-label="Minimap"></canvas>
  <div class="legend"><span><i style="background:var(--k-class)"></i>class</span><span><i style="background:var(--k-function)"></i>function</span><span><i style="background:var(--k-dataclass)"></i>dataclass</span><span><i style="background:var(--k-enum)"></i>enum</span><span><b style="background:var(--ok)"></b>linked to a requirement</span><span><b style="background:var(--warn)"></b>no requirement</span><span>dashed: private</span><span>◁ inherits · ◁┄ realises</span><span>on touching a box: <b style="background:var(--r-owns)"></b>composes <b style="background:var(--r-agg)"></b>aggregates <b style="background:var(--r-calls)"></b>calls <b style="background:var(--r-uses)"></b>uses</span></div>
  <div class="card" id="card" hidden></div>
</div>
<aside class="tour" id="tour" hidden aria-label="Tour">
  <div class="th"><span class="tabs" role="tablist"><button data-tab="tours" role="tab" aria-selected="true">tours</button><button data-tab="reqs" role="tab" aria-selected="false">requirements</button></span><select id="tsel" aria-label="Tour"></select><button id="tclose" aria-label="Close">×</button></div>
  <div class="rf" id="rfilter"><input type="search" id="rq" placeholder="filter by id or title" aria-label="Filter requirements"><span class="chips"><button data-f="all" aria-pressed="true">all</button><button data-f="unverified" aria-pressed="false">unverified</button><button data-f="unlinked" aria-pressed="false">unlinked</button><button data-f="draft" aria-pressed="false">draft</button></span><span class="rn" id="rcount"></span></div>
  <div class="tc"><button id="tfirst" aria-label="To the start">⏮</button><button id="tprev" aria-label="Previous step">◀</button><button id="tplay" class="play" aria-label="Play">▶</button><button id="tnext" aria-label="Next step">▶|</button><input type="range" id="tscrub" min="0" max="0" value="0" aria-label="Step"><button class="follow" id="tfollow">follow</button></div>
  <label class="td">depth <input type="range" id="tdepth" min="1" max="7" value="3"><b id="tdv">3</b></label>
  <div class="tb" id="tbody"></div>
  <div class="tb" id="rbody"></div>
</aside>
<script>
(async()=>{
// the scene travels deflated and in base64; the browser inflates it with its own DecompressionStream
const PACKED='/*SCENE*/';
async function unpack(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')); return JSON.parse(await new Response(stream).text());}
if(typeof DecompressionStream==='undefined'){document.getElementById('stage').innerHTML='<p style="padding:20px;font-family:sans-serif">This browser cannot inflate the scene (it lacks DecompressionStream). Open the page in a current one.</p>'; return;}
const SCENE=decode(await unpack(PACKED));
// the scene comes compact (version 2): records are arrays whose columns `fields` names, and nodes and
// behaviours are named by index; a tour is a behaviour expanded through the behaviours its calls go on into
function decode(r){if(r.version!==2) return r;
  const col=name=>{const f=r.fields[name]; return row=>{const o={}; f.forEach((k,i)=>{o[k]=row[i];}); return o;};};
  const nodes=r.nodes.map(col('node')); const id=i=>i>=0&&nodes[i]?nodes[i].id:'';
  nodes.forEach(n=>{n.parent=id(n.parent);});
  const behaviours=r.behaviours.map(col('behaviour')).map(b=>({subject:id(b.subject),scenario:b.scenario,calls:b.calls.map(col('call')).map(c=>({to:id(c.to),label:c.label,next:c.behaviour,result:c.result}))}));
  behaviours.forEach(b=>{b.id=b.subject+(b.scenario?' / '+b.scenario:'');});
  const expand=(b0,depth)=>{const steps=[], stack=new Set();
    const walk=(b,caller,level)=>{stack.add(b); for(const c of behaviours[b].calls){if(steps.length>=2000) break;
      steps.push({f:caller,t:c.to,m:c.label,d:level}); if(c.next<0||level>=depth||stack.has(c.next)) continue;
      walk(c.next,c.to,level+1); steps.push({f:c.to,t:caller,m:c.result||'\u21a9',d:level,ret:1});} stack.delete(b);};
    walk(b0,behaviours[b0].subject,1); return steps;};
  const tours=r.tours.map(col('tour')).map(t=>{const b=behaviours[t.behaviour]; const o={id:b.id,subject:b.subject,scenario:b.scenario,group:t.group};
    Object.defineProperty(o,'steps',{get(){return this._s||(this._s=expand(t.behaviour,12));}}); return o;});
  return {nodes,world:r.world,lean_world:r.lean_world,titles:r.titles,tours,
    links:r.links.map(col('link')).map(l=>({from:id(l.from),to:id(l.to),kind:l.kind,count:l.count,multiplicity:l.multiplicity,sequences:l.behaviours.map(b=>behaviours[b]?behaviours[b].id:'')})),
    diagrams:r.diagrams.map(col('diagram')).map(d=>({name:d.name,kind:d.kind,nodes:d.nodes.map(id)})),
    ...trace(r,col,id)};}
// the requirements and verifications, their ids in place of indices
function trace(r,col,id){if(!r.requirements) return {requirements:[],verifications:[]};

/* ---------- use cases: listed with the requirements; the contract, its outcomes and who realises it ---------- */
const ucChain=id=>{const out=[]; for(let u=id;u&&RBY[u]&&RBY[u].kind==='usecase'&&!out.includes(u);u=RBY[u].parent) out.push(u); return out;};
const ucSpecific=id=>REQS.filter(q=>q.kind==='usecase'&&q.parent===id).map(q=>q.id);
const ucOutcomes=id=>{const seen=new Set(), out=[]; ucChain(id).forEach(u=>RBY[u].outcomes.forEach(o=>{if(!seen.has(o.name)){seen.add(o.name); out.push({...o,from:u});}}));
  return out.sort((a,b)=>(b.name==='default')-(a.name==='default'));};
function selectUseCase(id){const q=RBY[id], chain=ucChain(id); SEL=null;
  // what realises it: its own operations and those of every use case that specialises it
  const via=[]; const walk=u=>{RBY[u].nodes.forEach(op=>{if(N[op]) via.push({op,uc:u});}); ucSpecific(u).forEach(walk);}; walk(id);
  HLBOX=new Map(); HLROW=new Map(); RELATED=new Set();
  via.forEach(v=>{const r=N[v.op]; if(r.kind==='row'){HLROW.set(v.op,'uc'); HLBOX.set(r.parent,'uc'); anc(r.parent).forEach(a=>RELATED.add(a));} else {HLBOX.set(v.op,'uc'); anc(v.op).forEach(a=>RELATED.add(a));}});
  REQSEL={kind:'uc',id,ids:via.map(v=>v.op)}; markRow();
  const reqs=[...new Set(chain.flatMap(u=>RBY[u].binds))];
  const sig=chain.map(u=>RBY[u].signature).find(Boolean);
  let h=`<div class="hd"><div><div class="st">«use case»${reqWhere(q)?' · '+esc(reqWhere(q)):''}</div><b>${esc(q.id)}</b>`+
    `<div class="sum"><span class="badge ${esc(q.status)}">${esc(q.status||'no status')}</span> · ${via.length?via.length+' realisation'+(via.length>1?'s':''):'<span class="warn">nothing realises it</span>'}</div></div>`+
    `<span class="acts">${via.length?'<button data-zoom="1">frame</button>':''}<button class="x" data-close="1" aria-label="Close">×</button></span></div>`;
  h+=`<p class="says"><b>${esc(q.title)}</b></p>`+(sig?`<p class="says" style="font-family:var(--mono)">${esc(sig)}</p>`:'');
  const outs=ucOutcomes(id);
  const opName=op=>{const r=N[op]; return (r&&N[r.parent]?N[r.parent].label+'.':'')+op.split('::').pop();};
  const tourOf=(op,o)=>{const t=op+(o==='default'?'':' / '+o); return TBY[t]?t:'';};
  // the outcomes against the interfaces: each cell replays that ending from that interface
  h+=`<section style="--c:var(--accent)"><h4>Outcomes, from each interface <span class="n">${outs.length}</span></h4>`+(via.length?`<table class="uct"><tr><th></th>${via.map(v=>`<th>${esc(opName(v.op))}${v.uc!==id?`<div class="n">via ${esc(v.uc)}</div>`:''}</th>`).join('')}</tr>`+
    outs.map(o=>`<tr><td><span class="${o.name==='default'?'ok':'warn'}">${o.name==='default'?'✓':'↯'}</span> <b>${esc(o.name)}</b>${o.returns?` <span class="n">→ ${esc(o.returns)}</span>`:''}${o.from!==id?` <span class="n">from ${esc(o.from)}</span>`:''}<div class="n">${esc(o.text)}</div></td>`+
      via.map(v=>{const t=tourOf(v.op,o.name); return `<td>${t?`<button class="play" data-tour="${esc(t)}" data-i="0" title="replay ${esc(o.name)} from ${esc(opName(v.op))}">▶</button>`:'<span class="miss">not handled</span>'}</td>`;}).join('')+`</tr>`).join('')+`</table>`
    :outs.map(o=>`<div class="rel"><span><b>${esc(o.name)}</b> ${esc(o.text)}</span></div>`).join('')+`<div class="miss">no interface operation realises it</div>`)+`</section>`;
  if(chain.length>1) h+=`<section><h4>Specialises</h4>${chain.slice(1).map(reqLine).join('')}</section>`;
  const spec=ucSpecific(id); if(spec.length) h+=`<section><h4>Specialised by <span class="n">${spec.length}</span></h4>${spec.map(reqLine).join('')}</section>`;
  h+=`<section style="--c:var(--req)"><h4>Bound by <span class="n">${reqs.length}</span></h4>${reqs.length?reqs.map(reqLine).join(''):'<div class="miss">no requirement binds it</div>'}</section>`;
  card.innerHTML=h; card.hidden=false; dock(true); frameReq(); loop();}

/* ---------- requirements: the list in the bottom panel, the card, what lights up ---------- */
const reqWhere=q=>q.scope&&N[q.scope]?anc(q.scope).reverse().map(a=>N[a].label).join(' › '):'';
const reqNodes=q=>q.nodes.filter(id=>N[id]);
function light(ids){HLBOX=new Map(); HLROW=new Map(); RELATED=new Set();
  ids.forEach(id=>{const n=N[id]; if(!n) return; if(n.kind==='row'){HLROW.set(id,'req'); HLBOX.set(n.parent,'req');} else HLBOX.set(id,'req');
    anc(n.kind==='row'?n.parent:id).forEach(a=>RELATED.add(a));});}
function frameReq(){const ids=(REQSEL&&REQSEL.ids||[]).map(id=>N[id].kind==='row'?N[id].parent:id); if(!ids.length) return;
  const x0=Math.min(...ids.map(i=>N[i].x)), y0=Math.min(...ids.map(i=>N[i].y)), x1=Math.max(...ids.map(i=>N[i].x+N[i].w)), y1=Math.max(...ids.map(i=>N[i].y+N[i].h));
  fly(fit({x:x0,y:y0,w:x1-x0,h:y1-y0},.35));}
const nodeLine=id=>{const n=N[id], u=n.kind==='row'?N[n.parent]:n; return `<div class="rel" data-node="${esc(id)}"><span class="far">${esc(n.kind==='row'?qual(id):n.label)}</span><span class="mod">${esc(n.kind==='row'||n.kind==='unit'?(N[boxOf(id)]||{}).label||'':(LEVEL[n.kind]||n.kind))}</span></div>`;};
const reqLine=id=>{const q=RBY[id]; return `<div class="rel" data-req="${esc(id)}"><span><b class="rid">${esc(id)}</b> ${esc(q?q.title:'')}</span></div>`;};
const verLine=id=>{const v=VBY[id]; return `<div class="rel" data-ver="${esc(id)}"><span><b class="rid">${esc(id)}</b> ${esc(v.method||'')} <span class="badge ${esc(v.status)}">${esc(v.status||'no status')}</span></span></div>`+
  (v.tests.length?`<div class="tests">${v.tests.map(t=>esc(t.replace(/^.*\//,''))).join('<br>')}</div>`:`<div class="tests miss">no tests named</div>`);};
function selectReq(id,frame){const q=RBY[id]; if(!q) return; if(q.kind==='usecase') return selectUseCase(id); SEL=null; const ids=reqNodes(q); REQSEL={kind:'req',id,ids}; light(ids); markRow();
  const verified=q.vers.length;
  let h=`<div class="hd"><div><div class="st">«${esc(q.kind)}»${reqWhere(q)?' · '+esc(reqWhere(q)):''}</div><b>${esc(q.id)}</b>`+
    `<div class="sum"><span class="badge ${esc(q.status)}">${esc(q.status||'no status')}</span> · ${ids.length} linked · <span class="${verified?'ok':'warn'}">${verified?verified+' verification'+(verified>1?'s':''):'not verified'}</span></div></div>`+
    `<span class="acts">${ids.length?'<button data-zoom="1">frame</button>':''}<button class="x" data-close="1" aria-label="Close">×</button></span></div>`;
  h+=`<p class="says"><b>${esc(q.title)}</b></p>`+(q.text?q.text.split(/\n\s*\n/).map(par=>`<p class="says">${esc(par.replace(/\s*\n\s*/g,' ').trim())}</p>`).join(''):'');
  if(q.parent) h+=`<section><h4>Refines</h4>${reqLine(q.parent)}</section>`;
  if(q.kids.length) h+=`<section><h4>Refined by <span class="n">${q.kids.length}</span></h4>${q.kids.map(reqLine).join('')}</section>`;
  const ucs=REQS.filter(u=>u.kind==='usecase'&&u.binds.includes(q.id)).map(u=>u.id);
  if(ucs.length) h+=`<section style="--c:var(--accent)"><h4>Use cases it binds <span class="n">${ucs.length}</span></h4>${ucs.map(reqLine).join('')}</section>`;
  h+=`<section style="--c:var(--req)"><h4>Answered by <span class="n">${ids.length}</span></h4>${ids.length?ids.map(nodeLine).join(''):'<div class="miss">nothing in the design links it</div>'}</section>`;
  h+=`<section style="--c:var(--ok)"><h4>Verified by <span class="n">${verified}</span></h4>${verified?q.vers.map(verLine).join(''):'<div class="miss">no verification proves it</div>'}</section>`;
  card.innerHTML=h; card.hidden=false; dock(true); if(frame) frameReq(); loop();}
function selectVer(id){const v=VBY[id]; if(!v) return; SEL=null; const ids=[...new Set(v.requirements.flatMap(r=>RBY[r]?reqNodes(RBY[r]):[]))]; REQSEL={kind:'ver',id,ids}; light(ids); markRow();
  let h=`<div class="hd"><div><div class="st">«verification»</div><b>${esc(v.id)}</b><div class="sum"><span class="badge ${esc(v.status)}">${esc(v.status||'no status')}</span> · ${esc(v.method||'no method')} · ${v.tests.length} test${v.tests.length===1?'':'s'}</div></div>`+
    `<span class="acts">${ids.length?'<button data-zoom="1">frame</button>':''}<button class="x" data-close="1" aria-label="Close">×</button></span></div>`;
  h+=`<p class="says"><b>${esc(v.title)}</b></p>`;
  h+=`<section style="--c:var(--req)"><h4>Proves <span class="n">${v.requirements.length}</span></h4>${v.requirements.map(reqLine).join('')}</section>`;
  h+=`<section style="--c:var(--ok)"><h4>Tests <span class="n">${v.tests.length}</span></h4>${v.tests.length?`<div class="tests" style="margin-left:0">${v.tests.map(esc).join('<br>')}</div>`:'<div class="miss">no tests named</div>'}</section>`;
  card.innerHTML=h; card.hidden=false; dock(true); frameReq(); loop();}

// the list: a tree of requirements by what they refine, then the constraints
const R={filter:'all',q:''}; const rbody=document.getElementById('rbody');
function reqRows(){const out=[], seen=new Set();
  const walk=(q,depth)=>{if(seen.has(q.id)) return; seen.add(q.id); out.push([q,depth]); q.kids.slice().sort().forEach(k=>walk(RBY[k],depth+1));};
  REQS.filter(q=>q.kind==='requirement'&&!RBY[q.parent]).sort((a,b)=>a.id.localeCompare(b.id)).forEach(q=>walk(q,0));
  REQS.filter(q=>q.kind==='requirement'&&!seen.has(q.id)).forEach(q=>walk(q,0));
  const cs=REQS.filter(q=>q.kind==='constraint').sort((a,b)=>a.id.localeCompare(b.id));
  const ucs=[], done=new Set(); const uwalk=(q,depth)=>{if(done.has(q.id)) return; done.add(q.id); ucs.push([q,depth]); ucSpecific(q.id).sort().forEach(k=>uwalk(RBY[k],depth+1));};
  REQS.filter(q=>q.kind==='usecase'&&!(RBY[q.parent]&&RBY[q.parent].kind==='usecase')).sort((a,b)=>a.id.localeCompare(b.id)).forEach(q=>uwalk(q,0));
  return {reqs:out,cs,ucs};}
function keep(q){const t=R.q.toLowerCase(); if(t&&!(q.id.toLowerCase().includes(t)||q.title.toLowerCase().includes(t))) return false;
  if(q.kind==='usecase'&&(R.filter==='unverified'||R.filter==='unlinked')) return !q.nodes.length&&!ucSpecific(q.id).length;  // a use case is checked by what realises it
  if(R.filter==='unverified') return !q.vers.length; if(R.filter==='unlinked') return !reqNodes(q).length; if(R.filter==='draft') return q.status!=='approved'; return true;}
function listReqs(){const {reqs,cs,ucs}=reqRows(); let shown=0;
  const row=(q,depth)=>{if(!keep(q)) return ''; shown++; const ln=reqNodes(q).length;
    return `<tr class="r" data-req="${esc(q.id)}"><td class="id" style="padding-left:${8+depth*16}px">${depth?'↳ ':''}${esc(q.id)}</td><td class="t">${esc(q.title)}</td>`+
      `<td class="st"><span class="badge ${esc(q.status)}">${esc(q.status||'—')}</span></td>`+
      `<td>${q.kind==='usecase'?ucOutcomes(q.id).map(o=>`<span class="vchip ${o.name==='default'?'test':''}" title="${esc(o.text)}">${o.name==='default'?'✓':'↯'} ${esc(o.name)}</span>`).join(''):q.vers.length?q.vers.map(v=>`<span class="vchip ${VBY[v].method==='test'&&VBY[v].tests.length?'test':''}" data-ver="${esc(v)}" title="${esc(VBY[v].title)}">${esc(v)}</span>`).join(''):'<span class="miss">none</span>'}</td>`+
      `<td class="n">${ln?ln:'<span class="miss">0</span>'}</td></tr>`;};
  let h=`<table class="rtab"><thead><tr><th>id</th><th>title</th><th class="st">status</th><th>verified by</th><th class="n">linked</th></tr></thead><tbody>`;
  const uq=ucs.map(([q,d])=>row(q,d)).join(''); if(uq) h+=`<tr class="grp"><td colspan="5">Use cases</td></tr>`+uq;
  const rq=reqs.map(([q,d])=>row(q,d)).join(''); if(rq) h+=`<tr class="grp"><td colspan="5">Requirements</td></tr>`+rq;
  const cq=cs.map(q=>row(q,0)).join(''); if(cq) h+=`<tr class="grp"><td colspan="5">Constraints</td></tr>`+cq;
  if(!shown) h+=`<tr><td colspan="5" class="miss" style="padding:14px 8px">nothing matches</td></tr>`;
  rbody.innerHTML=h+'</tbody></table>'; document.getElementById('rcount').textContent=`${shown} of ${REQS.length}`; markRow();}
function markRow(){rbody.querySelectorAll('tr.on').forEach(t=>t.classList.remove('on')); if(REQSEL&&(REQSEL.kind==='req'||REQSEL.kind==='uc')){const t=rbody.querySelector(`tr[data-req="${CSS.escape(REQSEL.id)}"]`); if(t) t.classList.add('on');}}
rbody.addEventListener('click',e=>{const v=e.target.closest('[data-ver]'); if(v){selectVer(v.dataset.ver); return;} const t=e.target.closest('tr[data-req]'); if(t) selectReq(t.dataset.req,true);});
document.getElementById('rq').oninput=e=>{R.q=e.target.value; listReqs();};
document.querySelector('#rfilter .chips').addEventListener('click',e=>{const b=e.target.closest('[data-f]'); if(!b) return; R.filter=b.dataset.f;
  document.querySelectorAll('#rfilter .chips button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); listReqs();});
// the tabs of the bottom panel
function tab(name){const list=name==='reqs'; tourEl.classList.toggle('listing',list); document.body.classList.toggle('listed',list);
  document.querySelectorAll('.tour .tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===name)));
  document.getElementById('tours').setAttribute('aria-pressed',String(!tourEl.hidden&&!list)); document.getElementById('reqs').setAttribute('aria-pressed',String(!tourEl.hidden&&list));
  if(list){play(false); T.idx=-1; ACTIVE=new Set(); FORCED=new Set(); caption.hidden=true; listReqs(); loop();} else seq();}
document.querySelector('.tour .tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(!b) return; if(b.dataset.tab==='tours') openTours(); else openReqs();});
function openReqs(){document.body.classList.add('touring'); tourEl.hidden=false; tab('reqs'); setTimeout(resize,30);}
document.getElementById('reqs').onclick=()=>(!tourEl.hidden&&tourEl.classList.contains('listing'))?closeTours():openReqs();
window.dsViewer={box:id=>N[id]&&{...scr(N[id]),U},select,selectReq,selectVer};  // where a box is on screen, for tests and for a host page

/* ---------- private members: in or out, the boxes follow ---------- */
let showPriv=true;
document.getElementById('priv').onclick=e=>{showPriv=!showPriv; e.target.setAttribute('aria-pressed',String(!showPriv)); e.target.textContent=showPriv?'hide private':'show private';
  const moves=ORDER.map(id=>{const n=N[id]; return [n,[n.x,n.y,n.w,n.h],showPriv?n.full:n.lean];});
  if(!showPriv) moves.forEach(([n,,to])=>{if(!to) n.hidden=true;});
  Object.assign(WORLD,box(showPriv?SCENE.world:SCENE.lean_world));
  const t0=performance.now(); lanim=now=>{let k=Math.min(1,(now-t0)/450); k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    moves.forEach(([n,a,b])=>{if(!b) return; n.x=a[0]+(b[0]-a[0])*k; n.y=a[1]+(b[1]-a[1])*k; n.w=a[2]+(b[2]-a[2])*k; n.h=a[3]+(b[3]-a[3])*k;});
    if(k>=1){if(showPriv) ORDER.forEach(id=>{N[id].hidden=false;}); lanim=null; if(SEL) select(SEL); return false;} return true;}; loop();};
document.getElementById('fs').onclick=()=>{if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});};

function focusBox(){const ids=new Set(FOCUS); const hit=ORDER.filter(id=>ids.has(id)&&N[id].kind!=='package'); if(!hit.length) return null;
  const x0=Math.min(...hit.map(i=>N[i].x)), y0=Math.min(...hit.map(i=>N[i].y)), x1=Math.max(...hit.map(i=>N[i].x+N[i].w)), y1=Math.max(...hit.map(i=>N[i].y+N[i].h));
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};}
/* ---------- tours: a behaviour replayed over the structure ---------- */
const TOURS=SCENE.tours||[], TBY={}; TOURS.forEach(t=>TBY[t.id]=t);
const T={id:null,depth:3,idx:-1,playing:false,follow:true}; let steps=[], lanes=[], timer=0;
const tourEl=document.getElementById('tour'), tsel=document.getElementById('tsel'), scrub=document.getElementById('tscrub'), depthEl=document.getElementById('tdepth');
const caption=document.getElementById('caption'), playBtn=document.getElementById('tplay'), followBtn=document.getElementById('tfollow');
function tourName(t){const s=N[t.subject]; const own=s&&s.kind==='row'&&N[s.parent].kind==='unit'?N[s.parent].label+'.':s&&s.kind==='row'&&N[s.parent].kind==='iface'?N[s.parent].label+' ':'';
  return own+t.subject.split('::').pop().replace('#sig','')+(t.scenario?' / '+t.scenario:'');}
tsel.innerHTML=[['interface','interfaces'],['method','methods and functions']].map(([g,l])=>{const ts=TOURS.filter(t=>t.group===g); return ts.length?`<optgroup label="${l}">`+ts.map(t=>`<option value="${esc(t.id)}">${esc(tourName(t))} · ${t.steps.length} steps</option>`).join('')+'</optgroup>':'';}).join('');
function buildSteps(){const t=TBY[T.id]; steps=t?t.steps.filter(s=>s.d<=T.depth):[]; lanes=[];
  steps.forEach(s=>[s.f,s.t].forEach(n=>{const u=unitOf(n); if(!lanes.includes(u)) lanes.push(u);})); scrub.max=Math.max(0,steps.length-1);}
function setTour(id){T.id=id; tsel.value=id; const mx=Math.max(1,...TBY[id].steps.map(s=>s.d)); depthEl.max=mx; if(T.depth>mx) T.depth=mx; depthEl.value=T.depth; document.getElementById('tdv').textContent=T.depth; buildSteps();}
function openTours(id){document.body.classList.add('touring'); tourEl.hidden=false; tab('tours'); if(id||!T.id) setTour(id||(TOURS.find(t=>t.group==='interface')||TOURS[0]).id); setTimeout(resize,30); go(T.idx);}
function closeTours(){play(false); document.body.classList.remove('touring'); tourEl.hidden=true; document.getElementById('tours').setAttribute('aria-pressed','false'); document.getElementById('reqs').setAttribute('aria-pressed','false'); document.body.classList.remove('listed'); T.idx=-1; ACTIVE=new Set(); FORCED=new Set(); caption.hidden=true; setTimeout(resize,30); loop();}
function playAt(id,i){openTours(id); const st=TBY[id].steps[i]; if(st.d>T.depth){T.depth=st.d; depthEl.value=st.d; document.getElementById('tdv').textContent=st.d; buildSteps();} lock(); go(steps.indexOf(st));}
const focusRect=id=>{const n=N[id]; return n.kind==='row'?N[n.parent]:n;};
function union(a,b){const x=Math.min(a.x,b.x), y=Math.min(a.y,b.y); return {x,y,w:Math.max(a.x+a.w,b.x+b.w)-x,h:Math.max(a.y+a.h,b.y+b.h)-y};}
function camFor(s){const A=focusRect(s.f), B=focusRect(s.t); let c=fit(union(A,B),.25);
  const minS=Math.min(.75,120/Math.max(B.w,1));  // the callee must be readable: else frame its module, or the callee alone
  if(c.s<minS){const m=boxOf(B.id); const bx=m?fit(N[m],.1):null; const only=(bx&&bx.s>=minS*.55)?bx:fit(B,.6); c=only.s>c.s?only:c;}
  c.s=Math.min(c.s,1.4); return c;}
function go(i){T.idx=Math.max(-1,Math.min(steps.length-1,i)); const s=steps[T.idx]; ACTIVE=new Set(); FORCED=new Set();
  if(s){[s.f,s.t].forEach(id=>anc(id).forEach(a=>{ACTIVE.add(a); FORCED.add(a);})); if(T.follow) fly(camFor(s),600);
    caption.innerHTML=`${T.idx+1}/${steps.length} · ${esc(short(s.f))} → ${esc(s.m)}<span class="z">depth ${s.d} · ${esc(anc(s.t).reverse().slice(1).map(a=>short(a)).join(' › '))}</span>`; caption.hidden=false;}
  else caption.hidden=true;
  scrub.value=Math.max(0,T.idx); seq(); loop();}
function release(){if(T.follow){T.follow=false; followBtn.classList.add('on');}}
function lock(){T.follow=true; followBtn.classList.remove('on');}
function play(on){T.playing=on; playBtn.textContent=on?'❚❚':'▶'; clearTimeout(timer); stage.classList.toggle('quiet',on); if(on){if(T.idx>=steps.length-1) T.idx=-1; lock(); tick();}}
function tick(){if(!T.playing) return; if(T.idx>=steps.length-1){play(false); return;} go(T.idx+1); timer=setTimeout(tick,1250);}
playBtn.onclick=()=>play(!T.playing);
document.getElementById('tnext').onclick=()=>{play(false); lock(); go(T.idx+1);};
document.getElementById('tprev').onclick=()=>{play(false); lock(); go(T.idx-1);};
document.getElementById('tfirst').onclick=()=>{play(false); lock(); go(-1); fly(fit(WORLD,.02));};
scrub.oninput=()=>{play(false); lock(); go(+scrub.value);};
followBtn.onclick=()=>{lock(); if(steps[T.idx]) fly(camFor(steps[T.idx]));};
tsel.onchange=()=>{play(false); setTour(tsel.value); go(-1);};
depthEl.oninput=()=>{const cur=steps[T.idx]; T.depth=+depthEl.value; document.getElementById('tdv').textContent=T.depth; buildSteps();
  let i=cur?steps.indexOf(cur):-1; if(cur&&i<0){const all=TBY[T.id].steps; for(let j=all.indexOf(cur);j>=0;j--){i=steps.indexOf(all[j]); if(i>=0) break;}} go(i);};
document.getElementById('tours').onclick=()=>(tourEl.hidden||tourEl.classList.contains('listing'))?openTours():closeTours();
document.getElementById('tclose').onclick=closeTours;
addEventListener('keydown',e=>{if(tourEl.hidden||['INPUT','SELECT'].includes(e.target.tagName)) return; if(e.key===' '){e.preventDefault(); play(!T.playing);} if(e.key==='ArrowRight'){play(false); lock(); go(T.idx+1);} if(e.key==='ArrowLeft'){play(false); lock(); go(T.idx-1);}});
function drawTour(){if(T.idx<0) return;
  for(let i=Math.max(0,T.idx-4);i<=T.idx;i++){const s=steps[i]; if(!s) continue; const A=repOf(s.f), B=repOf(s.t); if(!A||!B) continue; const cur=i===T.idx;
    stepEdge(A,B,cur?1:.3,cur?2.6:1.5,s.ret,cur?{n:i+1,m:s.m}:null);}}
function stepEdge(A,B,alpha,lw,ret,label){
  const [a1,a2]=span(A).map(sx), [b1,b2]=span(B).map(sx); let y1=anchorY(A), y2=anchorY(B), x1,x2,c1,c2;
  ctx.globalAlpha=alpha; ctx.strokeStyle=K.accent; ctx.lineWidth=lw; ctx.setLineDash(ret?[6,5]:[]);
  if(A===B||(b1<a2-4&&b2>a1+4)){const o=Math.max(24,30*cam.s); x1=a2; x2=b2; if(A===B){y1-=4; y2+=6;} c1=[x1+o,y1]; c2=[x2+o,y2];}
  else if(b1>=a2){x1=a2; x2=b1; const d=Math.max(30,(x2-x1)/2); c1=[x1+d,y1]; c2=[x2-d,y2];}
  else {x1=a1; x2=b2; const d=Math.max(30,(x1-x2)/2); c1=[x1-d,y1]; c2=[x2+d,y2];}
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],x2,y2); ctx.stroke(); ctx.setLineDash([]);
  arrow(x2,y2,Math.atan2(y2-c2[1],x2-c2[0]),K.accent);
  if(label){const t=.55, bz=(p0,p1,p2,p3)=>(1-t)**3*p0+3*(1-t)**2*t*p1+3*(1-t)*t*t*p2+t**3*p3;
    ctx.font=`12px ${K.mono}`; const m=label.m.length>40?label.m.slice(0,39)+'…':label.m; const bw=ctx.measureText(m).width+36;
    const mx=Math.max(bw/2+6,Math.min(W-bw/2-60,bz(x1,c1[0],c2[0],x2))), my=Math.max(60,Math.min(H-60,bz(y1,c1[1],c2[1],y2)));
    ctx.globalAlpha=1; rr(mx-bw/2,my-11,bw,22,11); ctx.fillStyle=K.panel; ctx.fill(); ctx.strokeStyle=K.accent; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(mx-bw/2+12,my,10,0,7); ctx.fillStyle=K.accent; ctx.fill(); ctx.textAlign='center'; text(String(label.n),mx-bw/2+12,my+4,label.n>99?8.5:10,K.bg,'700'); ctx.textAlign='left';
    text(m,mx-bw/2+26,my+4,12,K.fg);}
  ctx.globalAlpha=1;}
function seq(){const body=document.getElementById('tbody'); if(tourEl.hidden) return;
  const SU=(body.clientWidth||340)<560?.8:1, BW=Math.max(260,(body.clientWidth||340)/SU), top=34, RH=26;
  const gap=Math.max(70,(BW-80)/Math.max(1,lanes.length-1)), LW=Math.max(BW,60+gap*(lanes.length-1)+60), lx=i=>40+i*gap, H2=top+steps.length*RH+24;
  let s=`<svg width="${LW*SU}" height="${H2*SU}" viewBox="0 0 ${LW} ${H2}">`;
  lanes.forEach((l,i)=>{s+=`<text x="${lx(i)}" y="16" text-anchor="middle" font-weight="700">${esc(N[l]?N[l].label.split('(')[0]:l)}</text><line x1="${lx(i)}" y1="22" x2="${lx(i)}" y2="${H2-6}" stroke="var(--line)" stroke-dasharray="3 3"/>`;});
  steps.forEach((st,i)=>{const a=lanes.indexOf(unitOf(st.f)), b=lanes.indexOf(unitOf(st.t)), y=top+i*RH+14, cur=i===T.idx, past=i<T.idx;
    const col=cur||past?'var(--accent)':'var(--fg)', op=cur?1:past?.5:.85, ind=(st.d-1)*3;
    s+=`<g data-i="${i}" style="cursor:pointer" opacity="${op}"><rect x="0" y="${y-13}" width="${LW}" height="${RH}" fill="${cur?'var(--accent-soft)':'transparent'}"/>`;
    if(a===b){const x=lx(a)+4+ind; s+=`<path d="M${x} ${y-4} h18 v9 h-16" fill="none" stroke="${col}" stroke-width="${cur?2:1.1}" ${st.ret?'stroke-dasharray="4 3"':''}/><text x="${x+22}" y="${y+4}" style="fill:${col}">${esc(st.m.slice(0,34))}</text>`;}
    else {const x1=lx(a)+(b>a?4:-4), x2=lx(b)+(b>a?-4:4), dir=b>a?1:-1;
      s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="${cur?2:1.1}" ${st.ret?'stroke-dasharray="4 3"':''}/><path d="M${x2} ${y} l${-7*dir} -4 l0 8z" fill="${col}"/>`;
      s+=`<text x="${Math.min(x1,x2)+6}" y="${y-4}" style="fill:${col}">${esc(st.m.slice(0,Math.max(8,Math.floor(Math.abs(x2-x1)/6.6))))}</text>`;}
    s+=`<text x="3" y="${y+4}" style="fill:var(--muted);font-size:9px">${i+1}</text></g>`;});
  body.innerHTML=s+'</svg>';
  body.querySelector('svg').onclick=e=>{const g=e.target.closest('[data-i]'); if(g){play(false); lock(); go(+g.dataset.i);}};
  if(T.idx>=0){const y=(top+T.idx*RH)*SU; if(y<body.scrollTop+20||y>body.scrollTop+body.clientHeight-40) body.scrollTop=y-body.clientHeight/2;
    const a=lanes.indexOf(unitOf(steps[T.idx].t)), x=(40+Math.max(0,a)*gap)*SU; if(x<body.scrollLeft+20||x>body.scrollLeft+body.clientWidth-40) body.scrollLeft=x-body.clientWidth/2;}}
new ResizeObserver(()=>{clearTimeout(seq._t); seq._t=setTimeout(seq,80);}).observe(document.getElementById('tbody'));

resize(); const fb=focusBox(); Object.assign(cam,fb?fit(fb,.15):fit(WORLD,.02)); loop();
})();
</script>
