# Argos repository configuration. See ConfigReader for the schema.
#
# [project].asil declares the project's safety integrity level. NA
# enables the Owner Protocol autonomous loop (PROTOCOL-autonomous-loop); QM and
# above reserve the Owner role to a human.

[project]
asil = "NA"

# C++ test discovery: the GoogleTest plugin reads from
# ``tests/unit/<package>/`` where ``<package>`` matches the
# namespace under ``include/``. Tests outside that tree fire
# W-TEST-LAYOUT-UNRECOGNISED.

[sources]
cpp = ["src", "include"]

# The design of this repository is written in DriftSpec (design/**/*.ds) and
# read by argos-design-driftspec; the PlantUML design plugin stays out so the
# host resolves the DriftSpec reader.
[plugins]
disabled = ["argos-design-plantuml"]
