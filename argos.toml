# Argos repository configuration. See ConfigReader for the schema.
#
# [project].asil declares the project's safety integrity level. NA
# enables the Owner Protocol autonomous loop (PROTOCOL-autonomous-loop); QM and
# above reserve the Owner role to a human.

[project]
asil = "NA"

# C++ test discovery: the GoogleTest plugin reads from
# ``tests/unit/<package>/`` where ``<package>`` matches the
# namespace under ``include/``. Tests outside that tree fire
# W-TEST-LAYOUT-UNRECOGNISED.

[sources]
cpp = ["src", "include"]

# The design of this repository is written in DriftSpec (design/**/*.ds) and
# read by argos-design-driftspec; the PlantUML design plugin stays out so the
# host resolves the DriftSpec reader.
[plugins]
disabled = ["argos-design-plantuml"]

# The C++ reader lists a destructor and a deleted copy assignment as methods of
# the class that declares them; DriftSpec cannot name them (~Parser, operator=)
# and they are an idiom of a non-copyable RAII class, not design. Until
# argos-implementation-cpp14 skips special member functions in drift, the two
# findings on Parser are exempted here with the design kept honest.
[[diagnose.exempt]]
code = "E-DRIFT-METHOD-EXTRA"
source = "ds.parse.Parser"
reason = "Parser owns a TSParser: its destructor and deleted copy assignment are the non-copyable RAII idiom, special member functions the design language does not name (the cpp14 reader lists them as methods)."
