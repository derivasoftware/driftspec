# Argos repository configuration. See ConfigReader for the schema.
#
# [project].asil declares the project's safety integrity level. NA
# enables the Owner Protocol autonomous loop (PROTOCOL-autonomous-loop); QM and
# above reserve the Owner role to a human.

[project]
asil = "NA"

# What this repository is made of: each part of its specification, by
# technology, and the folders it is in. argos reads each declared part only
# with the plugin that serves its technology, so no [plugins] disabled is
# needed to keep the PlantUML reader away (argos REQ-01089-1). The
# requirements, verifications and constraints live in the DriftSpec design.

[requirements]
driftspec = ["design"]

[verifications]
driftspec = ["design"]

[constraints]
driftspec = ["design"]

[design]
driftspec = ["design"]

# The engine is C++ under src/ and include/; the Python face, the package
# driftspec, is Python under python/ (its module names start there:
# python/driftspec/live.py is driftspec.live). The extension in
# python/src/native.cpp is read by neither reader: the C++ one is not pointed
# at it and the Python one reads only .py files.
[sources]
cpp = ["src", "include"]
python = ["python"]

# The engine's tests run on GoogleTest, read from ``tests/unit/<package>/``
# where ``<package>`` matches the namespace under ``include/`` (tests outside
# that tree fire W-TEST-LAYOUT-UNRECOGNISED); the Python face's run on pytest; the viewer's own
# code, the tours it replays over scenes ds writes, runs on vitest (DS-329).
[tests]
gtest = ["tests"]
pytest = ["tests/unit/python", "tests/integration/python", "tests/system/python"]
vitest = ["tests/integration/viewer"]

# Phase 3 (DDEV-1466, DDEV-1507): code without design and stale evidence fail the gate. W-DESIGN-NO-CODE
# and W-DESIGN-NO-FUNCTION join once the anonymous-namespace helpers are lifted (DS-326).
[diagnose]
errors = ["W-CODE-NO-DESIGN", "W-EVIDENCE-STALE"]

# The C++ reader lists a destructor and a deleted copy assignment as methods of
# the class that declares them; DriftSpec cannot name them (~Parser, operator=)
# and they are an idiom of a non-copyable RAII class, not design. Until
# argos-implementation-cpp14 skips special member functions in drift, the two
# findings on Parser are exempted here with the design kept honest.
[[diagnose.exempt]]
code = "E-DRIFT-METHOD-EXTRA"
source = "ds.parse.Parser"
reason = "Parser owns a TSParser: its destructor and deleted copy assignment are the non-copyable RAII idiom, special member functions the design language does not name (the cpp14 reader lists them as methods)."

# The native module is read by no reader (DDEV-1468, Owner's choice): its functions are C++ over
# the CPython API, registered in method tables, so the design of driftspec._native is exempted
# rather than parsed. The trade-off is accepted: a changed native function can let its design go
# stale without a finding.
[[diagnose.exempt]]
code = "W-DESIGN-NO-FUNCTION"
source = "CL__native"
reason = "driftspec._native is C++ over the CPython API: its functions are registered in method tables, not written as code a reader sees. The Python face's tests exercise every one of them."

[[diagnose.exempt]]
code = "W-DESIGN-NO-CODE"
source = "CL__native_Workspace"
reason = "Same: the native Workspace type is a CPython type object, registered, not a class a reader sees."

[[diagnose.exempt]]
code = "W-RELATION-NO-CODE"
source = "driftspec.Workspace"
reason = "Same: driftspec.Workspace holds the native Workspace (self._native = _native.Workspace(...)), a CPython type no reader sees, so argos cannot find the class the composition points at."
