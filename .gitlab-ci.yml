# CI for driftspec. The shared pattern (one-pipeline workflow rules,
# rebase-gate, version-bump, cmake+gtest job, lightweight pre-commit venv
# and the argos-diagnose gate) lives in deriva/infra/ci-templates; this
# file carries only driftspec's knobs.

include:
  - project: deriva/infra/ci-templates
    ref: main
    file:
      - /templates/base.yml
      - /templates/cpp.yml
      - /templates/precommit.yml
      - /templates/argos-gate.yml

variables:
  # The runners share one host: every job that compiles (cmake --build --parallel, the wheel's
  # scikit-build, the Emscripten build) takes at most two processes, so the jobs of a pipeline
  # running side by side do not take every core between them.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  # The grammar's manifest carries the version of the whole tool.
  VERSION_MANIFEST: grammar/tree-sitter.json
  # The version goes up on merge, not in the branch (DDEV-1548, the fleet's DDEV-1448): a merge
  # request leaves the version alone, and version-release bumps every manifest at par on main
  # after each merge, in a commit of its own ("Bump version to X.Y.Z"). "Bump: minor" or
  # "Bump: major" in the merge request's description or in a commit message bumps more than patch.
  # Before, every merge sent each other open merge request back to main for a new number and a
  # whole pipeline.
  VERSION_BUMP_MODE: "merge"
  # A branch behind main merges without rebasing (DDEV-1526), with merge_method = "merge" in
  # ci-templates' projects.toml: rebase-gate lets it through with a warning and lists the files
  # changed on both sides. The merged tree is first tested by main's pipeline, which catches two
  # merge requests that pass apart and break together.
  REBASE_GATE: "0"
  # The execution evidence, as gafas and prueba give it to a Python repository:
  # cpp-evidence builds the project for evidence from outside, runs every test
  # and hands the reach record to the gate, which requires it (DS-11).
  ARGOS_EVIDENCE: "1"

# The Release ds travels to the viewer's tests (viewer-js).
# A compiler cache for the two C++ builds that set a merge request's pace (DS-314): the runners
# share one host and keep $HOME, so ccache (a static release, fetched once per runner) keeps the
# objects of every build, and a change recompiles only what it touches. The cache is the
# project's own, and independent of the folder a job runs in.
.ccache:
  before_script:
    - |
      CCACHE_HOME="$HOME/.cache/ccache-4.10.2"
      (
        flock -x 200
        if [ ! -x "$CCACHE_HOME/ccache" ]; then
          mkdir -p "$CCACHE_HOME"
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz |
            tar -xJ --strip-components=1 -C "$CCACHE_HOME"
        fi
      ) 200>/tmp/ccache-4.10.2.install.lock
      # 12 GB (DS-449): at 5 GB the gcc, the instrumented clang and the wheel builds of every branch in
      # flight evicted one another (4.7/5.0 GiB, 22 cleanups in one job, 16% hits on the evidence build)
      export CCACHE_DIR="$HOME/.cache/ccache/$CI_PROJECT_NAME" CCACHE_MAXSIZE=12G
      # a job runs in one of several folders of the runner (builds/<runner>/<slot>/...): the objects
      # are made independent of it, so the cache serves every slot and the coverage maps stay right
      export CCACHE_BASEDIR="$CI_PROJECT_DIR" CCACHE_NOHASHDIR=1
      export CFLAGS="${CFLAGS:-} -ffile-prefix-map=$CI_PROJECT_DIR/=" CXXFLAGS="${CXXFLAGS:-} -ffile-prefix-map=$CI_PROJECT_DIR/="
      export CMAKE_C_COMPILER_LAUNCHER="$CCACHE_HOME/ccache" CMAKE_CXX_COMPILER_LAUNCHER="$CCACHE_HOME/ccache"
      "$CCACHE_HOME/ccache" --zero-stats > /dev/null
  after_script:
    - CCACHE_DIR="$HOME/.cache/ccache/$CI_PROJECT_NAME" "$HOME/.cache/ccache-4.10.2/ccache" --show-stats || true
    # the disk the cache leaves on the runners' host, to grow it with data (DS-449)
    - df -h "$HOME" | tail -1 || true

cpp-evidence:
  extends: [.ccache]

# The tests run the Release engine with the JSON sink's checks on (DS-461): fields in byte order, one document, no
# result taken with nothing written. A Release build leaves them off by default, so a broken contract passed CI while a
# debug build failed. Measured on the whole suite: 67.4 s off, 67.6-69.3 s on; cpp-test is not on the critical path.
cpp-test:
  extends: [.ccache]
  variables:
    DS_JSON_CHECK: "1"
  artifacts:
    when: always
    paths:
      - $BUILD_DIR/*.junit.xml
      - $BUILD_DIR/ds
    reports:
      junit: $BUILD_DIR/*.junit.xml
    expire_in: 1 week

# The gate installs the DriftSpec reader over the fleet's pinned plugins, and
# this merge request's own engine under it: the reader loads the design through
# the driftspec package (DS-90), so the wheel python-wheel builds from this tree is what reads it.
# Since DS-4 every class has its design and the gate blocks the merge like
# everywhere else in the fleet.
argos-diagnose:
  needs: [python-wheel, cpp-evidence, pre-commit]
  script:
    - pip install --no-deps --upgrade "argos-design-driftspec" dist/driftspec-*.whl
    - !reference [.argos-diagnose-gate, script]

# the driftspec package, the Python face (DS-84, DS-288): the engine built as its CPython extension and
# driven by pytest, the language server through a real stdio session.
python:
  extends: [.on-mr]
  stage: test
  script:
    - python3 -m venv .python && . .python/bin/activate
    - pip install -q pytest "pygls>=2.0"
    - cmake -S . -B build-py -DCMAKE_BUILD_TYPE=Release -DDS_PYTHON=ON -DPython_EXECUTABLE="$PWD/.python/bin/python"
    - cmake --build build-py --parallel --target driftspec_python ds_browser
    - PYTHONPATH=build-py/python python -m pytest -q -p no:cacheprovider tests/integration/python tests/system/python --junitxml=build-py/python.junit.xml
  artifacts:
    when: always
    reports:
      junit: build-py/python.junit.xml
    expire_in: 1 week

# The engine for a page in a browser (DS-203, REQ-00113-1): ds.js and ds.wasm, built with Emscripten.
# The runners run jobs on their host, so the job installs the pinned SDK into its cache the first
# time and reuses it after. The two files are the artefact the playground page loads.
wasm:
  stage: test
  rules:
    - if: $ARGOS_ON_DEMAND
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    EMSDK_VERSION: "7.0.0"
  cache:
    key: emsdk-$EMSDK_VERSION
    paths: [.emsdk/]
  script:
    - set -euo pipefail
    - if [ ! -x .emsdk/emsdk ]; then rm -rf .emsdk && git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk; fi
    - .emsdk/emsdk install "$EMSDK_VERSION" && .emsdk/emsdk activate "$EMSDK_VERSION"
    - . .emsdk/emsdk_env.sh
    - emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
    - cmake --build build-wasm --parallel
    - ls -l build-wasm/ds.js build-wasm/ds.wasm build-wasm/tree-sitter-driftspec.wasm
  artifacts:
    # the engine and the grammar the page's editor is coloured by (DS-269)
    paths: [build-wasm/ds.js, build-wasm/ds.wasm, build-wasm/tree-sitter-driftspec.wasm]
    expire_in: 1 week

# The playground as a static site (DS-204): the page, the engine the wasm job built, the lessons and
# the examples, ready to serve as files. The lessons themselves are replayed by the python job
# (tests/system/python/test_playground.py).
playground-site:
  stage: test
  needs: [wasm]
  rules:
    - if: $ARGOS_ON_DEMAND
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 playground/build.py --wasm build-wasm --out playground/site
    - ls playground/site
  artifacts:
    paths: [playground/site/]
    expire_in: 1 month

# The Python face as a wheel (DS-181): built on every merge request, so a broken build is seen
# before main and the gate reads the design with it (DS-90). One abi3 wheel serves every Python
# from 3.10.
python-wheel:
  stage: test
  # its own rules: .on-mr-and-main is an alias of .on-mr in ci-templates, and main is where it uploads
  rules:
    - if: $ARGOS_ON_DEMAND
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - set -euo pipefail
    - rm -rf .wheel dist && python3 -m venv .wheel && . .wheel/bin/activate
    - pip install -q build
    - python -m build --wheel
    - ls -l dist/
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# The wheel uploaded to this project's PyPI registry on main, beside argos and its plugins. The
# version bump of every merge request keeps each upload new; an upload of a version already there
# fails rather than replace it. Consumers: pip install driftspec --index-url <the group's PyPI
# index>; the import is driftspec.
publish-python:
  stage: deploy
  rules:
    - if: $ARGOS_ON_DEMAND
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [python-wheel]
  interruptible: false
  script:
    - set -euo pipefail
    - rm -rf .publish && python3 -m venv .publish && . .publish/bin/activate
    - pip install -q 'twine>=6.1' 'packaging>=24.2'
    - TWINE_USERNAME=gitlab-ci-token TWINE_PASSWORD="$CI_JOB_TOKEN"
      twine upload --non-interactive --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" dist/*.whl

# The viewer's own code (DS-130): the tours it replays, run by node over scenes the
# ds that cpp-test built writes. cpp-test runs each gtest binary, not ctest, so the
# viewer's tests need a job of their own.
viewer-js:
  extends: [.on-mr]
  stage: test
  needs: [cpp-test]
  variables:
    DS_JSON_CHECK: "1"  # the scenes ds writes, checked as they are written (DS-461)
  script:
    - node --version
    - npm ci --no-audit --no-fund
    - DS="$CI_PROJECT_DIR/build-ci/ds" VIEWER="$CI_PROJECT_DIR/viewer/scene.html" ROOT="$CI_PROJECT_DIR"
      npx vitest run tests/integration/viewer --reporter=default
      --reporter=junit --outputFile.junit=viewer.junit.xml
  artifacts:
    when: always
    reports:
      junit: viewer.junit.xml

# Every format of every document, pinned as golden files (DS-395): the ds that cpp-test built
# against tests/system/python/golden/expected. cpp-test runs each gtest binary, not ctest, so the
# goldens need a job of their own, like the viewer's tests.
golden:
  extends: [.on-mr]
  stage: test
  needs: [cpp-test]
  variables:
    DS_JSON_CHECK: "1"  # every document ds writes, checked as it is written (DS-461); 25.8 s off, 25.6 s on
  script:
    - python3 -m venv .golden && . .golden/bin/activate
    - pip install -q pytest
    - DS="$CI_PROJECT_DIR/build-ci/ds" python -m pytest -q -p no:cacheprovider tests/system/python/test_golden.py
      --junitxml=golden.junit.xml
  artifacts:
    when: always
    reports:
      junit: golden.junit.xml
