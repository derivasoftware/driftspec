# CI for driftspec. The shared pattern (one-pipeline workflow rules,
# rebase-gate, version-bump, cmake+gtest job, lightweight pre-commit venv
# and the argos-diagnose gate) lives in deriva/infra/ci-templates; this
# file carries only driftspec's knobs.

include:
  - project: deriva/infra/ci-templates
    ref: main
    file:
      - /templates/base.yml
      - /templates/cpp.yml
      - /templates/precommit.yml
      - /templates/argos-gate.yml

variables:
  # The runners share one host: every job that compiles (cmake --build --parallel, the wheel's
  # scikit-build, the Emscripten build) takes at most two processes, so the jobs of a pipeline
  # running side by side do not take every core between them.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  # The grammar's manifest carries the version of the whole tool.
  VERSION_MANIFEST: grammar/tree-sitter.json
  # The execution evidence, as gafas and prueba give it to a Python repository:
  # cpp-evidence builds the project for evidence from outside, runs every test
  # and hands the reach record to the gate, which requires it (DS-11).
  ARGOS_EVIDENCE: "1"

# The Release ds travels to the viewer's tests (viewer-js).
cpp-test:
  artifacts:
    when: always
    paths:
      - $BUILD_DIR/*.junit.xml
      - $BUILD_DIR/ds
    reports:
      junit: $BUILD_DIR/*.junit.xml
    expire_in: 1 week

# The gate installs the DriftSpec reader over the fleet's pinned plugins, and
# this merge request's own engine under it: the reader loads the design through
# pyds (DS-90), so the wheel pyds-wheel builds from this tree is what reads it.
# Since DS-4 every class has its design and the gate blocks the merge like
# everywhere else in the fleet.
argos-diagnose:
  needs: [pyds-wheel, cpp-evidence, pre-commit]
  script:
    - pip install --no-deps "argos-design-driftspec" dist/driftspec-*.whl
    - !reference [.argos-diagnose-gate, script]

# pyds, the Python face (DS-84): the engine built as its CPython extension and
# driven by pytest, the language server through a real stdio session.
pyds:
  extends: [.on-mr]
  stage: test
  script:
    - python3 -m venv .pyds && . .pyds/bin/activate
    - pip install -q pytest "pygls>=2.0"
    - cmake -S . -B build-py -DCMAKE_BUILD_TYPE=Release -DDS_PYTHON=ON -DPython_EXECUTABLE="$PWD/.pyds/bin/python"
    - cmake --build build-py --parallel --target driftspec_python ds_browser
    - PYTHONPATH=build-py/python python -m pytest -q -p no:cacheprovider tests/integration/python tests/system/python --junitxml=build-py/pyds.junit.xml
  artifacts:
    when: always
    reports:
      junit: build-py/pyds.junit.xml
    expire_in: 1 week

# The engine for a page in a browser (DS-203, REQ-00113-1): ds.js and ds.wasm, built with Emscripten.
# The runners run jobs on their host, so the job installs the pinned SDK into its cache the first
# time and reuses it after. The two files are the artefact the playground page loads.
wasm:
  stage: test
  rules:
    - if: $ARGOS_ON_DEMAND
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    EMSDK_VERSION: "7.0.0"
  cache:
    key: emsdk-$EMSDK_VERSION
    paths: [.emsdk/]
  script:
    - set -euo pipefail
    - if [ ! -x .emsdk/emsdk ]; then rm -rf .emsdk && git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk; fi
    - .emsdk/emsdk install "$EMSDK_VERSION" && .emsdk/emsdk activate "$EMSDK_VERSION"
    - . .emsdk/emsdk_env.sh
    - emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
    - cmake --build build-wasm --parallel
    - ls -l build-wasm/ds.js build-wasm/ds.wasm build-wasm/tree-sitter-driftspec.wasm
  artifacts:
    # the engine and the grammar the page's editor is coloured by (DS-269)
    paths: [build-wasm/ds.js, build-wasm/ds.wasm, build-wasm/tree-sitter-driftspec.wasm]
    expire_in: 1 week

# The playground as a static site (DS-204): the page, the engine the wasm job built, the lessons and
# the examples, ready to serve as files. The lessons themselves are replayed by the pyds job
# (tests/system/python/test_playground.py).
playground-site:
  stage: test
  needs: [wasm]
  rules:
    - if: $ARGOS_ON_DEMAND
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 playground/build.py --wasm build-wasm --out playground/site
    - ls playground/site
  artifacts:
    paths: [playground/site/]
    expire_in: 1 month

# The Python face as a wheel (DS-181): built on every merge request, so a broken build is seen
# before main and the gate reads the design with it (DS-90). One abi3 wheel serves every Python
# from 3.10.
pyds-wheel:
  stage: test
  # its own rules: .on-mr-and-main is an alias of .on-mr in ci-templates, and main is where it uploads
  rules:
    - if: $ARGOS_ON_DEMAND
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - set -euo pipefail
    - rm -rf .wheel dist && python3 -m venv .wheel && . .wheel/bin/activate
    - pip install -q build
    - python -m build --wheel
    - ls -l dist/
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# The wheel uploaded to this project's PyPI registry on main, beside argos and its plugins. The
# version bump of every merge request keeps each upload new; an upload of a version already there
# fails rather than replace it. Consumers: pip install driftspec --index-url <the group's PyPI
# index>; the import is pyds.
publish-pyds:
  stage: deploy
  rules:
    - if: $ARGOS_ON_DEMAND
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [pyds-wheel]
  interruptible: false
  script:
    - set -euo pipefail
    - rm -rf .publish && python3 -m venv .publish && . .publish/bin/activate
    - pip install -q 'twine>=6.1' 'packaging>=24.2'
    - TWINE_USERNAME=gitlab-ci-token TWINE_PASSWORD="$CI_JOB_TOKEN"
      twine upload --non-interactive --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" dist/*.whl

# The viewer's own code (DS-130): the tours it replays, run by node over scenes the
# ds that cpp-test built writes. cpp-test runs each gtest binary, not ctest, so the
# viewer's tests need a job of their own.
viewer-js:
  extends: [.on-mr]
  stage: test
  needs: [cpp-test]
  script:
    - node --version
    - DS="$CI_PROJECT_DIR/build-ci/ds" VIEWER="$CI_PROJECT_DIR/viewer/scene.html" ROOT="$CI_PROJECT_DIR"
      node --test --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=viewer.junit.xml tests/viewer/test_tours.mjs
  artifacts:
    when: always
    reports:
      junit: viewer.junit.xml
