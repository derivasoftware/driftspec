# The Python face of DriftSpec (DS-84): the engine as a CPython extension (abi3) and a language
# server on it. pip install . builds pyds._native with the CMake of this repository. Published to
# the registry as driftspec (DS-181): PyPI already serves a pyds, which an install that also reads
# PyPI would take over this one. The import stays pyds.
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "driftspec"
version = "0.0.162"
description = "DriftSpec: a software design as text, checked, drawn, compared and asked"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
lsp = ["pygls>=2.0"]

[project.scripts]
driftspec-lsp = "pyds.lsp:main"
driftspec-live = "pyds.live:main"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.define = { DS_PYTHON = "ON" }
build.targets = ["_native"]
install.components = ["python"]
wheel.packages = ["python/pyds"]
wheel.py-api = "cp310"
