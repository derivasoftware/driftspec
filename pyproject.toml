# The Python face of DriftSpec (DS-84): the engine as a CPython extension (abi3) and a language
# server on it. pip install . builds driftspec._native with the CMake of this repository. Installed
# and imported as driftspec (DS-181, DS-288).
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "driftspec"
version = "0.1.21"
description = "DriftSpec: a software design as text, checked, drawn and asked"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "ARGOSQA SLU (deriva)" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
lsp = ["pygls>=2.0"]

[project.scripts]
driftspec-lsp = "driftspec.lsp:main"
driftspec-live = "driftspec.live:main"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.define = { DS_PYTHON = "ON" }
build.targets = ["_native", "ds"]  # the extension and the ds command (DS-303)
install.components = ["python"]
wheel.packages = ["python/driftspec"]
# the licence, its notice and the notices of the third-party code compiled into the extension travel with it
# (DS-284, DS-287)
wheel.license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "grammar/LICENSE"]
wheel.py-api = "cp310"

[tool.pytest.ini_options]
testpaths = ["tests"]  # not the build folders, which hold the tests of what the build fetches

[tool.cibuildwheel]
# One wheel per platform (DS-292): the extension targets the stable ABI, so cp310-abi3 serves Python
# 3.10 and later. Each wheel is tried before it ships: ds answers, and the package checks an example.
build = "cp310-*"
build-frontend = "build"
test-command = [
  "ds --version",
  "ds check {project}/examples/hola",
  "python -c \"import driftspec, sys; sys.exit(driftspec.check(sys.argv[1]).errors)\" {project}/examples/hola",
]
