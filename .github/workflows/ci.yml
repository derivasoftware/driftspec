# The public pipeline (DS-289): DriftSpec built and tested on Linux, Windows and macOS on every
# push to main and every pull request. The project's own CI lives in GitLab, on Linux runners
# only; GitHub's hosted runners carry the two systems GitLab cannot reach.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: engine · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      # a compiler cache kept between runs: a push recompiles what it touches, not the whole tool
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: engine-${{ matrix.os }}
          max-size: 2G
      # on Windows, MSVC through Ninja: the Visual Studio generator cannot take a compiler launcher
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - name: configure
        shell: bash
        run: |
          gen=""; [ "$RUNNER_OS" = Windows ] && gen="-G Ninja"
          cmake -S . -B build $gen -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: build
        # GitHub's runners have 3 or 4 cores; an unbounded build runs them out of memory
        run: cmake --build build --config Release --parallel 4
      - name: test
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    name: python package · ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: python-ubuntu
          max-size: 1G
      - name: build
        # as GitLab builds it: the package beside its native module and the playground's library,
        # which the playground's tests load from the build
        run: |
          pip install "pygls>=2.0" pytest
          cmake -S . -B build-py -DCMAKE_BUILD_TYPE=Release -DDS_PYTHON=ON -DPython_EXECUTABLE="$(which python)" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-py --parallel 4
      - name: test
        run: PYTHONPATH=build-py/python python -m pytest -q
      - name: install
        # and what pip gives a user: ds and the package from the wheel
        run: |
          pip install .
          ds --version
          ds check examples/hola
