requirement:
  id: SREQ-00009-1
  title: The system shall draw the static model as class diagrams and as requirement diagrams
  description: >
    A class diagram shows a selection of classes, enumerations and modules
          with their members, ownership, inheritance and dependencies; a
          requirement diagram shows a selection of artefacts with what refines
          them, what verifies them and what realises them. Both are selections
          over the model, drawn by the same engine.
  rationale: >
    These are the two static views a design review reads: the structure and
          the traceability of what the structure answers to.
  status: DRAFT
  asil: NA
  tags:
    - render
    - static
